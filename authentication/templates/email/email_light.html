<!-- Light-branded mode - a middle ground between email.html (full
     marketing broadcast: header image, colour blocks, social-icon
     footer) and email_plain.html (no branding at all). Time-sensitive
     or security-adjacent transactional mail needs Primary-inbox
     delivery, which the fully branded template was losing to Gmail's
     Promotions classifier (see the 2026-09-05 "Promotions tab" fix) -
     but the user still wants it recognizably MyFund, not a bare-bones
     plain email. So: a small text wordmark instead of a hero image/
     colour block, plain white body, minimal one-line footer. Used by
     OTP emails (send_otp_email / _send_otp in views.py, which render
     the code big/central/boxed inline before handing it to
     {{ message|safe }} below), password-change confirmation, referral
     reward emails, AutoSave failure notices, and scheduled-withdrawal
     completion emails - anything time-sensitive/actionable enough that
     it must not get buried in Promotions. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
      }
      a {
        color: #351265;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff">
    <div
      style="
        max-width: 600px;
        margin: 0;
        padding: 24px 20px 8px 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      "
    >
      <span style="font-size: 15px; font-weight: 700; color: #351265; letter-spacing: 0.3px;"
        >MyFund</span
      >
    </div>

    <div
      style="
        max-width: 600px;
        margin: 0;
        padding: 8px 20px 24px 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #1a1a1a;
        text-align: left;
      "
    >
      {{ message|safe }}
    </div>

    <!-- Minimal footer - unsubscribe + one line of tagline, nothing more
         (no social icons/address/trademark block - that's what tipped
         Gmail's classifier toward Promotions in the first place). -->
    <div
      style="
        max-width: 600px;
        margin: 0;
        padding: 12px 20px 20px 20px;
        border-top: 1px solid #e5e5e5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 12px;
        color: #888888;
        text-align: left;
      "
    >
      <p style="margin: 0 0 6px 0">MyFund - Save, Buy Properties, Earn Rent</p>
      <a
        href="https://www.myfundmobile.com/unsubscribe"
        style="color: #888888; text-decoration: underline"
        >Unsubscribe</a
      >
    </div>
  </body>
</html>
